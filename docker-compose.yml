name: citywheels-help-desk

services:
  agent:
    build: .
    image: citywheels-help-desk:local
    env_file:
      - path: .env
        required: false

  test:
    image: citywheels-help-desk:local
    build: .
    entrypoint: ["pytest"]

  eval:
    image: citywheels-help-desk:local
    build: .
    env_file:
      - path: .env
        required: false
    entrypoint: ["python", "eval/run_eval.py"]
    volumes:
      - ./eval:/app/eval
